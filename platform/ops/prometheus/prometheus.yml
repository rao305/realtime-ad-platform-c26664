global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: adserver
    static_configs:
      - targets: ["adserver:8080"]
  - job_name: spend-processor
    static_configs:
      - targets: ["spend-processor:9101"]
  - job_name: cache-sync
    static_configs:
      - targets: ["cache-sync:9102"]
  - job_name: analytics-sink
    static_configs:
      - targets: ["analytics-sink:9103"]
